name: Deploy Features Branch to EC2

on:
  push:
    branches: [ features ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh/
        echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        cat >> ~/.ssh/config << EOF
        Host aws-server
          HostName ${{ secrets.AWS_HOST }}
          User ${{ secrets.AWS_USER }}
          IdentityFile ~/.ssh/deploy_key
          StrictHostKeyChecking no
        EOF
    
    - name: Deploy to EC2
      run: |
        ssh aws-server << 'EOF'
          cd /home/ubuntu/Daily-Standup-Chatbot
          git pull origin features
          docker build -t daily-standup-chatbot:latest .
          docker stop daily-standup-chatbot 2>/dev/null || true
          docker rm daily-standup-chatbot 2>/dev/null || true
          docker run -d \
            --name daily-standup-chatbot \
            -p 4000:4000 \
            --env-file .env \
            --restart unless-stopped \
            daily-standup-chatbot:latest
          docker image prune -f
          echo "✅ Deployed from features branch!"
        EOF
